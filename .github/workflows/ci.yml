name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-proof:
    name: Check release PR test results
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify results for the merged release PR
        id: proof
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-ci.py

  metadata:
    name: Metadata and scripts
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Resolve tested tree
        if: github.event_name == 'pull_request'
        id: tested-tree
        run: printf 'oid=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Tested tree ${{ steps.tested-tree.outputs.oid }}
        if: github.event_name == 'pull_request'
        run: 'true'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Validate release version
        run: ./scripts/check-version.sh

      - name: Validate changelog
        run: python3 scripts/changelog.py check

      - name: Require changelog coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/check-changelog-change.py
          --base "${BASE_SHA}"
          --event-path "${GITHUB_EVENT_PATH}"

      - name: Validate packaging metadata
        run: python3 scripts/check-packaging.py

      - name: Test release CI verification
        run: python3 scripts/test-check-release-ci.py

  backend:
    name: Backend
    needs: release-proof
    if: ${{ !cancelled() && needs.release-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: '1'
        run: |
          # Older cache entries were built with -march=native on another runner.
          python -m pip cache remove hnswlib
          python -m pip install -r backend/requirements.txt

      - name: Check backend
        env:
          PYTHON_BIN: python
          PYTHONFAULTHANDLER: '1'
        run: ./scripts/check-backend.sh

      - name: Set up Node.js for browser smoke tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser smoke dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/face-manager-browsers
        run: |
          npm --prefix frontend ci
          npm install --prefix "${RUNNER_TEMP}/face-manager-ui-tools" --no-audit --no-fund playwright@1.65.1
          "${RUNNER_TEMP}/face-manager-ui-tools/node_modules/.bin/playwright" install --with-deps --only-shell chromium

      - name: Verify browser workflows
        timeout-minutes: 5
        env:
          PYTHON_BIN: python
          NODE_PATH: ${{ runner.temp }}/face-manager-ui-tools/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/face-manager-browsers
        run: ./scripts/check-ui.sh

      - name: Verify browser journey
        timeout-minutes: 5
        env:
          PYTHON_BIN: python
          NODE_PATH: ${{ runner.temp }}/face-manager-ui-tools/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/face-manager-browsers
          UI_SMOKE_JOURNEY_ONLY: '1'
        run: ./scripts/check-ui.sh

  frontend:
    name: Frontend
    needs: release-proof
    if: ${{ !cancelled() && needs.release-proof.outputs.reuse != 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend behavior
        run: node --test frontend/tests/*.test.cjs

      - name: Check frontend
        run: npm --prefix frontend run check

  windows-preview-cache:
    name: Preview cache (Windows)
    needs: release-proof
    if: ${{ !cancelled() && needs.release-proof.outputs.reuse != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest backend.tests.test_preview_cache_budget
