name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and scripts
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate release version
        run: ./scripts/check-version.sh

      - name: Validate changelog
        run: python3 scripts/changelog.py check

      - name: Require changelog coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/check-changelog-change.py
          --base "${BASE_SHA}"
          --event-path "${GITHUB_EVENT_PATH}"

      - name: Validate packaging metadata
        run: python3 scripts/check-packaging.py

  backend:
    name: Backend
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check backend
        env:
          PYTHON_BIN: python
        run: ./scripts/check-backend.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend behavior
        run: node --test frontend/tests/*.test.cjs

      - name: Check frontend
        run: npm --prefix frontend run check

  android:
    name: Android (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify offline models, build, lint and unit tests
        run: ./scripts/check-android.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native recognition, imports, persistence and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./android/gradlew -p android --no-daemon :app:connectedDebugAndroidTest
      - name: Retain Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-api-${{ matrix.api }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
