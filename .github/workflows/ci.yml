name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and scripts
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate release version
        run: ./scripts/check-version.sh

      - name: Validate changelog
        run: python3 scripts/changelog.py check

      - name: Require changelog coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/check-changelog-change.py
          --base "${BASE_SHA}"
          --event-path "${GITHUB_EVENT_PATH}"

      - name: Validate packaging metadata
        run: python3 scripts/check-packaging.py

  backend:
    name: Backend
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1 libglib2.0-0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        env:
          HNSWLIB_NO_NATIVE: '1'
        run: |
          # Older cache entries were built with -march=native on another runner.
          python -m pip cache remove hnswlib
          python -m pip install -r backend/requirements.txt

      - name: Check backend
        env:
          PYTHON_BIN: python
          PYTHONFAULTHANDLER: '1'
        run: ./scripts/check-backend.sh

      - name: Set up Node.js for browser smoke tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser smoke dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/face-manager-browsers
        run: |
          npm --prefix frontend ci
          npm install --prefix "${RUNNER_TEMP}/face-manager-ui-tools" --no-audit --no-fund playwright@1.65.1
          "${RUNNER_TEMP}/face-manager-ui-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify browser workflows
        env:
          PYTHON_BIN: python
          NODE_PATH: ${{ runner.temp }}/face-manager-ui-tools/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/face-manager-browsers
        run: ./scripts/check-ui.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend behavior
        run: node --test frontend/tests/*.test.cjs

      - name: Check frontend
        run: npm --prefix frontend run check

  windows-preview-cache:
    name: Preview cache (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m unittest backend.tests.test_preview_cache_budget
