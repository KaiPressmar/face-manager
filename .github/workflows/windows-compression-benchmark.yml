name: Compare Windows LZMA2 compression

on:
  push:
    branches: [chore/benchmark-lzma2]
    paths:
      - '.github/workflows/windows-compression-benchmark.yml'
      - 'packaging/windows/**'

permissions:
  contents: read

concurrency:
  group: windows-compression-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Compare and verify both installers
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
            backend/requirements-desktop-gpu.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build one bundle, compile both installers, and verify clean installs
        run: |
          @(
            '| Compression | Block threads | Inno elapsed (s) | Installer bytes | SHA-256 |'
            '| --- | ---: | ---: | ---: | --- |'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Host "Logical processors: $([Environment]::ProcessorCount)"
          ./packaging/windows/build-release.ps1 -CompareCompression
          & ./build/windows-venv/Scripts/python.exe -m pip freeze
      - name: Verify all upgrades with LZMA
        id: lzma-upgrades
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-installer-upgrade.ps1 -Version (Get-Content VERSION -Raw).Trim()
      - name: Verify all upgrades with LZMA2
        if: success() || steps.lzma-upgrades.conclusion == 'failure'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./packaging/windows/test-installer-upgrade.ps1 -Version (Get-Content VERSION -Raw).Trim()
          -InstallerDirectory ./build/compression-benchmark/lzma2
