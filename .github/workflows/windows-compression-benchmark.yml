name: Compare Windows installer compression

on:
  push:
    branches: [chore/streamline-actions]
    paths:
      - '.github/workflows/windows-compression-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    name: Windows installer (${{ matrix.compression }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        compression: [lzma, lzma/fast]
    env:
      INSTALLER_COMPRESSION: ${{ matrix.compression }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
            backend/requirements-desktop-gpu.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and test a clean installation
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          ./packaging/windows/build-release.ps1 -FastValidationInstaller:($env:INSTALLER_COMPRESSION -eq 'lzma/fast')
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = Get-Item "dist/FaceManager-Setup-$version.exe"
          "Installer size in bytes: $($installer.Length)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Build and clean install elapsed seconds: $($timer.Elapsed.TotalSeconds)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          & ./build/windows-venv/Scripts/python.exe -m pip freeze
      - name: Test all upgrade fixtures
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-installer-upgrade.ps1 -Version (Get-Content VERSION -Raw).Trim()
