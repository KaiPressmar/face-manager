name: Installer migration validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'packaging/windows/**'
      - 'backend/requirements*.txt'
      - 'backend/desktop_main.py'
      - 'backend/desktop_runtime.py'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'scripts/inventory-dependencies.py'
      - '.nvmrc'
      - 'VERSION'
      - '.github/workflows/installer-upgrade-validation.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-upgrade:
    name: Upgrade published Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
            backend/requirements-desktop-gpu.txt
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build candidate installer
        run: ./packaging/windows/build-release.ps1 -FastValidationInstaller
      - name: Verify upgrades from legacy CPU, legacy GPU, and combined installers
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-installer-upgrade.ps1 -Version (Get-Content VERSION -Raw).Trim()
