name: Publish Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Prepare release draft
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate release version
        run: ./scripts/check-version.sh

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/v${version}^{commit}")"; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
            if [[ "${tag_commit}" != "${RELEASE_SHA}" ]]; then
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::v${version} already identifies ${tag_commit}. Skipping publication from ${RELEASE_SHA}."
              exit 0
            fi
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if is_draft="$(gh release view "v${version}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${is_draft}" == false ]]; then
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::v${version} is already published. Skipping replacement of its assets."
              exit 0
            fi
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Resolve curated release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/face-manager-release-notes.md
        run: >-
          python3 scripts/changelog.py notes
          --version "${VERSION}"
          --output "${RELEASE_NOTES_PATH}"

      - name: Create annotated tag
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Face Manager v${VERSION}" "${RELEASE_SHA}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/face-manager-release-notes.md
        run: |
          gh release create "v${VERSION}" \
            --title "Face Manager v${VERSION}" \
            --notes-file "${RELEASE_NOTES_PATH}" \
            --draft \
            --verify-tag \
            --target "${RELEASE_SHA}"

      - name: Sync existing GitHub Release notes
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/face-manager-release-notes.md
        run: |
          gh release edit "v${VERSION}" \
            --title "Face Manager v${VERSION}" \
            --notes-file "${RELEASE_NOTES_PATH}"

  windows-installer:
    name: Build Windows installer
    if: needs.release.outputs.publish == 'true'
    needs:
      - release
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      installer_sha256: ${{ steps.build.outputs.installer_sha256 }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # ONNX Runtime GPU 1.26 has no Windows wheel for Python 3.10.
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
            backend/requirements-desktop-gpu.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows release bundle
        id: build
        shell: pwsh
        run: ./packaging/windows/build-release.ps1

      - name: Exercise upgrades from published Windows installers
        shell: pwsh
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-installer-upgrade.ps1 -Version $env:VERSION

      - name: Attest Windows installer provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/FaceManager-Setup-${{ env.VERSION }}.exe

      - name: Upload installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$env:VERSION" `
            "dist/FaceManager-Setup-$env:VERSION.exe" `
            "dist/FaceManager-Setup-$env:VERSION.exe.sha256" `
            "dist/FaceManager-Setup-GPU-$env:VERSION.exe#Compatibility installer for legacy GPU updaters" `
            "dist/FaceManager-Setup-GPU-$env:VERSION.exe.sha256" `
            --clobber

  linux-installer:
    name: Build Ubuntu installer
    if: needs.release.outputs.publish == 'true'
    needs: release
    runs-on: ubuntu-26.04
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.14-dev python3.14-venv build-essential desktop-file-utils \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgl1 libgomp1 ocl-icd-libopencl1
      - name: Build and install the Ubuntu package
        run: |
          ./scripts/package-linux.sh
          package="face-manager_${VERSION}_amd64.deb"
          (cd dist && sha256sum -c "${package}.sha256")
          sudo apt-get install -y --no-install-recommends "./dist/${package}"
          test "$(face-manager --version)" = "${VERSION}"
          face-manager --check-runtime
      - name: Attest Ubuntu package provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/face-manager_${{ env.VERSION }}_amd64.deb
      - name: Upload Ubuntu package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" "dist/face-manager_${VERSION}_amd64.deb" "dist/face-manager_${VERSION}_amd64.deb.sha256" --clobber

  publish:
    name: Publish verified release
    if: needs.release.outputs.publish == 'true'
    needs: [release, windows-installer, linux-installer]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      WINDOWS_INSTALLER_SHA256: ${{ needs.windows-installer.outputs.installer_sha256 }}
    steps:
      - name: Verify uploaded desktop installers and publish
        shell: bash
        run: |
          tag="v${VERSION}"
          [[ "${WINDOWS_INSTALLER_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(gh api "repos/${GH_REPO}/commits/${tag}" --jq '.sha')" == "${RELEASE_SHA}" ]]
          release="$(gh release view "${tag}" --json apiUrl,isDraft,isPrerelease,tagName)"
          jq -e --arg tag "${tag}" '.tagName == $tag and .isDraft and (.isPrerelease | not)' <<< "${release}" >/dev/null
          release_url="$(jq -er '.apiUrl' <<< "${release}")"
          release_id="${release_url##*/}"
          [[ "${release_id}" =~ ^[0-9]+$ ]]
          assets="$(gh api --paginate "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100" | jq -s 'add')"

          for package in "FaceManager-Setup-${VERSION}.exe" "FaceManager-Setup-GPU-${VERSION}.exe" "face-manager_${VERSION}_amd64.deb"; do
            for asset in "${package}" "${package}.sha256"; do
              jq -e --arg name "${asset}" '[.[] | select(.name == $name and .size > 0 and .state == "uploaded")] | length == 1' <<< "${assets}" >/dev/null
            done
          done

          checksum_dir="$(mktemp -d)"
          trap 'rm -rf "${checksum_dir}"' EXIT
          for package in "FaceManager-Setup-${VERSION}.exe" "FaceManager-Setup-GPU-${VERSION}.exe"; do
            digest="$(jq -er --arg name "${package}" '.[] | select(.name == $name) | .digest' <<< "${assets}")"
            [[ "${digest}" == "sha256:${WINDOWS_INSTALLER_SHA256}" ]]
            gh release download "${tag}" --pattern "${package}.sha256" --dir "${checksum_dir}"
            sidecar="${checksum_dir}/${package}.sha256"
            if ! cmp -s "${sidecar}" <(printf '%s  %s\r\n' "${WINDOWS_INSTALLER_SHA256}" "${package}"); then
              cmp "${sidecar}" <(printf '%s  %s\n' "${WINDOWS_INSTALLER_SHA256}" "${package}")
            fi
            read -r sidecar_digest _ < <(sha256sum "${sidecar}")
            uploaded_digest="$(jq -er --arg name "${package}.sha256" '.[] | select(.name == $name) | .digest' <<< "${assets}")"
            [[ "${uploaded_digest}" == "sha256:${sidecar_digest}" ]]
          done

          gh release edit "${tag}" --draft=false --latest
