name: Publish Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Tag and publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate release version
        run: ./scripts/check-version.sh

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve curated release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/face-manager-release-notes.md
        run: >-
          python3 scripts/changelog.py notes
          --version "${VERSION}"
          --output "${RELEASE_NOTES_PATH}"

      - name: Create annotated tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Face Manager v${VERSION}" "${RELEASE_SHA}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        if: steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/face-manager-release-notes.md
        run: |
          gh release create "v${VERSION}" \
            --title "Face Manager v${VERSION}" \
            --notes-file "${RELEASE_NOTES_PATH}" \
            --target "${RELEASE_SHA}"

      - name: Sync existing GitHub Release notes
        if: steps.version.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/face-manager-release-notes.md
        run: |
          gh release edit "v${VERSION}" \
            --title "Face Manager v${VERSION}" \
            --notes-file "${RELEASE_NOTES_PATH}"

  windows-installer:
    name: Build Windows installer (${{ matrix.variant }})
    if: github.event.workflow_run.conclusion == 'success'
    needs:
      - release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - cpu
          - gpu
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.release.outputs.version }}
      INSTALLER_SUFFIX: ${{ matrix.variant == 'gpu' && '-GPU' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt
            backend/requirements-desktop-gpu.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows release bundle
        shell: pwsh
        run: ./packaging/windows/build-release.ps1 -Variant ${{ matrix.variant }}

      - name: Attest Windows installer provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/FaceManager-Setup${{ env.INSTALLER_SUFFIX }}-${{ env.VERSION }}.exe

      - name: Upload installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$env:VERSION" `
            "dist/FaceManager-Setup$env:INSTALLER_SUFFIX-$env:VERSION.exe" `
            "dist/FaceManager-Setup$env:INSTALLER_SUFFIX-$env:VERSION.exe.sha256" `
            --clobber

  android-apk:
    name: Build Android APK
    if: github.event.workflow_run.conclusion == 'success'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Load release signing identity when configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            umask 077
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/android-release.jks" >> "${GITHUB_ENV}"
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'configured=false' >> "${GITHUB_OUTPUT}"
          fi
      - name: Build Android release from tested commit
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/package-android.sh
      - name: Retain unsigned APK for offline signing
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-${{ env.VERSION }}
          path: dist/*-unsigned.apk
          retention-days: 14
      - name: Attest signed Android APK
        if: steps.signing.outputs.configured == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/FaceManager-Android-${{ env.VERSION }}.apk
      - name: Publish signed Android APK and checksum
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" "dist/FaceManager-Android-${VERSION}.apk" "dist/FaceManager-Android-${VERSION}.apk.sha256" --clobber
      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/android-release.jks"
